# Retreat Social Print: production stack.   docker compose --env-file .env up -d --build
# Public entry is the reverse proxy only. The database, API and web containers are not published on any host port.
name: rsp

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rsp
      POSTGRES_DB: rsp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [db:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U rsp -d rsp"], interval: 5s, timeout: 5s, retries: 20 }
    security_opt: [no-new-privileges:true]

  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      NODE_ENV: production
      PORT: "4100"
      DATABASE_URL: postgres://rsp:${POSTGRES_PASSWORD}@db:5432/rsp
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env (at least 32 random characters)}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env (https address guests will use)}
      STORAGE_DIR: /data/storage
      TRUST_PROXY: "1"                      # exactly one proxy (Caddy) sits in front
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes: [storage:/data/storage]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  web:
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    restart: unless-stopped
    depends_on: [api]
    read_only: true
    tmpfs: [/tmp, "/app/apps/web/.next/cache"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api, web]
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]

volumes:
  db:
  storage:
  caddy_data:
  caddy_config:
